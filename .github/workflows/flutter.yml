name: Build Flutter APK
on:
  push:
    branches: [main]
    paths:
      - 'wadidget_app/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wadidget_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name wadidget --org com.example
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-${{ github.run_number }}
          files: wadidget_app/build/app/outputs/flutter-apk/app-release.apk
